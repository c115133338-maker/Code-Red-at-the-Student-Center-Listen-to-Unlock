<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        body {
            font-family: var(--font-sans);
            background-color: #060a13;
            background-image:
                radial-gradient(circle at 12% 10%, rgba(244, 63, 94, 0.14), transparent 40%),
                radial-gradient(circle at 88% 85%, rgba(56, 189, 248, 0.12), transparent 42%),
                linear-gradient(rgba(148, 163, 184, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 163, 184, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 26px 26px, 26px 26px;
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        body.system-unlocked {
            background-image:
                radial-gradient(circle at 15% 12%, rgba(16, 185, 129, 0.18), transparent 44%),
                radial-gradient(circle at 85% 85%, rgba(56, 189, 248, 0.14), transparent 45%),
                linear-gradient(rgba(148, 163, 184, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 163, 184, 0.04) 1px, transparent 1px);
        }

        .font-mono-code {
            font-family: var(--font-mono);
        }

        /* Glass Security Terminal Card */
        .terminal-panel {
            background: rgba(15, 23, 42, 0.86);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(148, 163, 184, 0.18);
            box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.65);
        }

        /* Waveform Animation */
        @keyframes wavePulse {
            0%, 100% { height: 7px; }
            50% { height: 32px; }
        }

        .wave-bar {
            width: 4px;
            height: 7px;
            border-radius: 9999px;
            background: linear-gradient(180deg, #38bdf8, #818cf8);
            transition: height 0.15s ease;
        }

        .is-speaking .wave-bar {
            animation: wavePulse 0.65s ease-in-out infinite;
        }

        .is-speaking .wave-bar:nth-child(odd) {
            background: linear-gradient(180deg, #fb7185, #f59e0b);
        }

        /* Mic Recording Pulse */
        @keyframes micRing {
            0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.6); }
            70% { box-shadow: 0 0 0 14px rgba(244, 63, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
        }

        .mic-recording {
            animation: micRing 1.3s infinite;
        }

        /* Smooth Fade Slide */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-up {
            animation: fadeUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .btn-touch:active {
            transform: scale(0.97);
        }
    </style>
</head>

        function playDialogueTurns(turns, baseRate = null, onComplete = null) {
            if (!("speechSynthesis" in window)) {
                showToast("Speech synthesis is unavailable in this browser. Use the Transcript button to read the dialogue.", "info");
                if (onComplete) onComplete();
                return;
            }

            const effectiveRate = baseRate !== null ? baseRate : state.playbackSpeed;
            stopAllSpeech();
            const currentToken = ++playbackSessionToken;
            state.isPlayingAudio = true;
            updateWaveformDOM();

            let index = 0;

            function speakNextTurn() {
                if (currentToken !== playbackSessionToken) return;
                if (index >= turns.length) {
                    state.isPlayingAudio = false;
                    updateWaveformDOM();
                    if (onComplete) onComplete();
                    return;
                }

                const turn = turns[index];
                const profile = getVoiceProfile(turn.speaker);
                const utter = new SpeechSynthesisUtterance(turn.text);
                utter.lang = "en-US";
                if (profile.voice) utter.voice = profile.voice;
                utter.pitch = profile.pitch;
                // Sam speaks slightly slower with hesitation in Level 3 relative to user-selected speed
                utter.rate = turn.speaker === "Sam" ? Math.max(0.65, effectiveRate * 0.93) : effectiveRate;

                const speakerLabel = document.getElementById("activeSpeakerBadge");
                if (speakerLabel) {
                    speakerLabel.textContent = `🎙️ Speaking: ${turn.speaker} (${effectiveRate}x)`;
                }

                utter.onend = () => {
                    if (currentToken !== playbackSessionToken) return;
                    index++;
                    setTimeout(speakNextTurn, 220);
                };

                utter.onerror = () => {
                    if (currentToken !== playbackSessionToken) return;
                    index++;
                    speakNextTurn();
                };

                window.speechSynthesis.speak(utter);
            }

            speakNextTurn();
        }

                if (dlg) {
                    setTimeout(() => playDialogueTurns(dlg.turns, newSpeed), 80);
                }
            } else {
                render();
            }
        }

        function updateHud() {

            }
            hud.classList.remove("hidden");

            const allUnlocked = state.unlockedDigits.every(d => d !== null);

            const dot = document.getElementById("alertDot");
            const label = document.getElementById("alertLabel");

                badge.className = "inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 font-mono-code text-xs font-bold tracking-wider";

                        onclick="restartGame()"
                        class="btn-touch w-full sm:w-auto px-8 py-3.5 rounded-2xl font-extrabold text-sm bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg transition">
                        🔄 Play New AI-Generated Scenario
                    </button>
                </div>
            `;
        }

        // Initial Render on Load
        window.addEventListener("DOMContentLoaded", () => {
            render();
        });
    </script>
</body>
</html>
